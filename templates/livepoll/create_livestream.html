{% extends 'base_poll.html' %}
{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <h3 class="mb-3">라이브 스트림 등록</h3>
    
    <form action="{% url 'livepoll:create_livestream' %}" method="POST" class="card p-4 shadow-sm">
        {% csrf_token %}

        <!-- 1. 방송 제목 -->
        <div class="mb-3">
            <label for="title" class="form-label fw-bold">방송 제목</label>
            <input type="text" class="form-control" id="title" name="title" placeholder="예: 2026 실시간 Q&A 방송" required>
        </div>

        <!-- 2. 스트림 URL -->
        <div class="mb-3">
            <label for="stream_url" class="form-label fw-bold">스트림 URL (HLS / WebRTC 등)</label>
            <input type="url" class="form-control" id="stream_url" name="stream_url" placeholder="https://..." required>
            <div class="form-text">라이브 스트리밍 재생 주소(.m3u8 등)를 입력하세요.</div>
        </div>

        <!-- 3. 라이브 여부 스위치/체크박스 -->
        <div class="mb-3 form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="is_live" name="is_live">
            <label class="form-check-label" for="is_live">즉시 라이브 방송으로 설정</label>
        </div>

        <!-- 제출 버튼 -->
        <div class="d-grid gap-2 mt-3">
            <button type="submit" class="btn btn-primary">스트림 저장</button>
        </div>
    </form>
</div>
{% endblock %}
