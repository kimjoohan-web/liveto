<!-- templates/livepoll/create_poll.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 투표 출제 관리자</title>
    <style>
        .form-group { margin-bottom: 15px; }
        .form-control { width: 100%; padding: 8px; box-sizing: border-box; }
        .choice-row { margin-bottom: 5px; display: flex; gap: 10px; }
        .btn { padding: 8px 15px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; border: none; }
        .btn-secondary { background: #6c757d; color: white; border: none; }
        #choice-section { background: #f8f9fa; padding: 15px; border-radius: 5px; margin-top: 15px; }
    </style>
</head>
<body>

<div style="max-width: 600px; margin: 5px auto; padding: 20px;">
    <h2>📊 새 질문 및 보기 출제하기</h2>
    <hr>
    
    <form method="post" id="poll-form">
        {% csrf_token %}
        
        <!-- 질문 입력 섹션 -->
        <div class="form-group">
            <label>방송 선택</label>
            {{ question_form.live_stream }}
        </div>
        <div class="form-group">
            <label>질문 내용</label>
            {{ question_form.question_text }}
        </div>
        <div class="form-group">
            <label>질문 유형</label>
            {{ question_form.question_type }}
        </div>

        <!-- 보기 입력 섹션 (장고 폼셋 변수 필요) -->
        <div id="choice-section">
            <h3>옵션/보기 설정</h3>
            {{ formset.management_form }}
            <div id="choice-form-list">
                {% for form in formset %}
                    <div class="choice-row">
                        <span class="choice-number">{{ forloop.counter }}.</span>
                        {{ form.choice_text }}
                    </div>
                {% endfor %}
            </div>
            <div class="form-group">
                <label>현재 투표 진행 여부</label>
                {{ question_form.is_voting_now }}
            </div>
            <button type="button" class="btn btn-secondary" id="add-choice-btn" style="margin-top:10px;">+ 보기 추가</button>
             <button type="button" class="btn btn-secondary" id="remove-choice-btn" style="margin-top:10px;">- 보기 삭제</button>
        </div>

        <div style="margin-top: 20px; text-align: right;">
            <button type="submit" class="btn btn-primary">질문 저장하기</button>
        </div>
    </form>
</div>

<script>
    // 1. 주관식 선택 시 보기 입력칸 숨기기 기능
    const typeSelect = document.getElementById('id_question_type');
    const choiceSection = document.getElementById('choice-section');

    function toggleChoiceSection() {
        if (typeSelect.value === 'TEXT') {
            choiceSection.style.display = 'none';
        } else {
            choiceSection.style.display = 'block';
        }
    }
    typeSelect.addEventListener('change', toggleChoiceSection);
    window.addEventListener('DOMContentLoaded', toggleChoiceSection);

    // 2. 동적으로 보기 입력창 추가하는 자바스크립트 (Formset 매칭)
    const addBtn = document.getElementById('add-choice-btn');
    const totalForms = document.getElementById('id_choices-TOTAL_FORMS'); // 장고가 자동 생성하는 ID

    addBtn.addEventListener('click', function() {
        const currentFormCount = parseInt(totalForms.value);
        const formList = document.getElementById('choice-form-list');
        
        // 첫 번째 보기 로우를 복사하여 새 로우 생성
        const rows = formList.getElementsByClassName('choice-row');
        const newRow = rows[0].cloneNode(true);
        
        // 내부 입력창의 name, id 속성을 고유한 인덱스로 변경 (예: choices-0-choice_text -> choices-2-choice_text)
        const input = newRow.querySelector('input');
        input.value = '';
        input.name = `choices-${currentFormCount}-choice_text`;
        input.id = `id_choices-${currentFormCount}-choice_text`;
        
        // 번호 업데이트
        newRow.querySelector('.choice-number').innerText = `${currentFormCount + 1}.`;
        
        formList.appendChild(newRow);
        
        // 장고 관리 매니지먼트 폼 개수 1 증가
        totalForms.value = currentFormCount + 1;
    });
    
    // 3. 동적으로 보기 입력창 삭제하는 자바스크립트
    const removeBtn = document.getElementById('remove-choice-btn');
    removeBtn.addEventListener('click', function() {
        const currentFormCount = parseInt(totalForms.value);
        if (currentFormCount > 1) {
            const formList = document.getElementById('choice-form-list');
            formList.removeChild(formList.lastElementChild);
            totalForms.value = currentFormCount - 1;
        }
    });
</script>

</body>
</html>
